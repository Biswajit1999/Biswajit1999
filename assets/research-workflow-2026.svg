<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-labelledby="t d"><title id="t">From physical measurement to auditable scientific result</title><desc id="d">Five stage animated technical research pipeline: sensing, calibration, modelling, feedback and reproducible evidence.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111D"/><stop offset=".56" stop-color="#0C1B2E"/><stop offset="1" stop-color="#11182F"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102B40" stop-opacity=".86"/><stop offset="1" stop-color="#081420" stop-opacity=".94"/></linearGradient>
<linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39E8DF"/><stop offset=".55" stop-color="#75B9FC"/><stop offset="1" stop-color="#B799FC"/></linearGradient>
<radialGradient id="planet" cx=".25" cy=".24" r=".95"><stop stop-color="#92EDE7"/><stop offset=".24" stop-color="#398DAD"/><stop offset=".65" stop-color="#1F426E"/><stop offset="1" stop-color="#0A182C"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="232" rx="17" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="230" rx="16" fill="none" stroke="#2B586B"/>
<text x="35" y="34" font-family="monospace" letter-spacing="2.3" font-size="13" fill="#81DBE4">MY RESEARCH WORKFLOW</text>
<text x="1172" y="34" text-anchor="end" font-family="monospace" font-size="11" fill="#6B91A9">MEASURE → MODEL → TEST → SHARE</text>
<path d="M53 122 H1144" stroke="#356A83" stroke-width="4" stroke-dasharray="7 10" opacity=".7"/>
<rect x="33" y="69" width="210" height="111" rx="12" fill="url(#glass)" stroke="#56E7DB" stroke-opacity=".54"/><circle cx="56" cy="88" r="4" fill="#56E7DB"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle><text x="55" y="116" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F0FAFF">01 / SENSE</text><text x="55" y="141" font-family="Arial,sans-serif" font-size="13" fill="#ACC5D5">Interferometry, FITS</text><rect x="55" y="159" width="164" height="3" rx="1" fill="#29516C"/><rect x="55" y="159" width="30" height="3" rx="1" fill="#56E7DB"><animate attributeName="width" values="26;160;26" dur="5s" begin="0s" repeatCount="indefinite"/></rect><rect x="268" y="69" width="210" height="111" rx="12" fill="url(#glass)" stroke="#77CEF4" stroke-opacity=".54"/><circle cx="291" cy="88" r="4" fill="#77CEF4"><animate attributeName="r" values="3;5;3" dur="3.5s" repeatCount="indefinite"/></circle><text x="290" y="116" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F0FAFF">02 / CALIBRATE</text><text x="290" y="141" font-family="Arial,sans-serif" font-size="13" fill="#ACC5D5">Noise and uncertainty</text><rect x="290" y="159" width="164" height="3" rx="1" fill="#29516C"/><rect x="290" y="159" width="30" height="3" rx="1" fill="#77CEF4"><animate attributeName="width" values="26;160;26" dur="5s" begin="0.58s" repeatCount="indefinite"/></rect><rect x="503" y="69" width="210" height="111" rx="12" fill="url(#glass)" stroke="#B2AFFD" stroke-opacity=".54"/><circle cx="526" cy="88" r="4" fill="#B2AFFD"><animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/></circle><text x="525" y="116" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F0FAFF">03 / MODEL</text><text x="525" y="141" font-family="Arial,sans-serif" font-size="13" fill="#ACC5D5">Physics and inference</text><rect x="525" y="159" width="164" height="3" rx="1" fill="#29516C"/><rect x="525" y="159" width="30" height="3" rx="1" fill="#B2AFFD"><animate attributeName="width" values="26;160;26" dur="5s" begin="1.16s" repeatCount="indefinite"/></rect><rect x="738" y="69" width="210" height="111" rx="12" fill="url(#glass)" stroke="#F5BD7F" stroke-opacity=".54"/><circle cx="761" cy="88" r="4" fill="#F5BD7F"><animate attributeName="r" values="3;5;3" dur="4.5s" repeatCount="indefinite"/></circle><text x="760" y="116" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F0FAFF">04 / CONTROL</text><text x="760" y="141" font-family="Arial,sans-serif" font-size="13" fill="#ACC5D5">AO and thermal loops</text><rect x="760" y="159" width="164" height="3" rx="1" fill="#29516C"/><rect x="760" y="159" width="30" height="3" rx="1" fill="#F5BD7F"><animate attributeName="width" values="26;160;26" dur="5s" begin="1.7399999999999998s" repeatCount="indefinite"/></rect><rect x="973" y="69" width="210" height="111" rx="12" fill="url(#glass)" stroke="#69EDC2" stroke-opacity=".54"/><circle cx="996" cy="88" r="4" fill="#69EDC2"><animate attributeName="r" values="3;5;3" dur="5s" repeatCount="indefinite"/></circle><text x="995" y="116" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F0FAFF">05 / VALIDATE</text><text x="995" y="141" font-family="Arial,sans-serif" font-size="13" fill="#ACC5D5">Reproducible evidence</text><rect x="995" y="159" width="164" height="3" rx="1" fill="#29516C"/><rect x="995" y="159" width="30" height="3" rx="1" fill="#69EDC2"><animate attributeName="width" values="26;160;26" dur="5s" begin="2.32s" repeatCount="indefinite"/></rect>
<circle cx="58" cy="122" r="5" fill="#F6D28B"><animateMotion path="M0 0 H1080" dur="8s" repeatCount="indefinite"/></circle>
<text x="35" y="210" font-family="monospace" font-size="11" fill="#829DB4">A workflow, not a claim of instrument-level validation: scope and limitations are documented project by project.</text>
</svg>