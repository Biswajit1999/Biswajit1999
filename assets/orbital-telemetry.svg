<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Biswajit Jana orbital research telemetry</title>
  <desc id="desc">Animated observatory dashboard showing an exoplanet orbit, a stellar spectrum, and research telemetry.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".48" stop-color="#0d1631"/><stop offset="1" stop-color="#120927"/></linearGradient>
    <radialGradient id="starCore"><stop stop-color="#fffbd1"/><stop offset=".35" stop-color="#ffca62"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></radialGradient>
    <linearGradient id="spectrum" x1="0" x2="1"><stop stop-color="#6d5dfc"/><stop offset=".2" stop-color="#00c2ff"/><stop offset=".42" stop-color="#39ffba"/><stop offset=".64" stop-color="#ffe66d"/><stop offset=".82" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="panel"><rect x="22" y="22" width="1156" height="316" rx="20"/></clipPath>
    <style>
      .label{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#7f91b4}.value{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#eaf1ff}.tiny{font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;fill:#8394b7}
      .star{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dash{stroke-dasharray:8 12;animation:flow 7s linear infinite}.scan{animation:scan 4.5s ease-in-out infinite}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.planet{animation:orbit 9s linear infinite;transform-origin:282px 179px}
      @keyframes twinkle{0%,100%{opacity:.18;transform:scale(.6)}50%{opacity:1;transform:scale(1.35)}}@keyframes flow{to{stroke-dashoffset:-200}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(315px);opacity:1}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.25);opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#space)"/><g clip-path="url(#panel)"><g fill="#d8e7ff"><circle class="star" cx="82" cy="64" r="1.5"/><circle class="star" cx="188" cy="106" r="1" style="animation-delay:-1s"/><circle class="star" cx="420" cy="51" r="1.5" style="animation-delay:-2s"/><circle class="star" cx="556" cy="91" r="1" style="animation-delay:-.5s"/><circle class="star" cx="754" cy="53" r="1.5" style="animation-delay:-1.7s"/><circle class="star" cx="944" cy="86" r="1" style="animation-delay:-2.4s"/><circle class="star" cx="1118" cy="57" r="1.5" style="animation-delay:-.8s"/><circle class="star" cx="1073" cy="297" r="1" style="animation-delay:-1.3s"/><circle class="star" cx="621" cy="313" r="1.5" style="animation-delay:-2.2s"/><circle class="star" cx="137" cy="297" r="1" style="animation-delay:-.4s"/></g><path d="M22 70H1178M438 70V338M850 70V338" stroke="#243557"/><path d="M22 70H1178" stroke="url(#spectrum)" stroke-width="2" opacity=".8"/></g><rect x="22" y="22" width="1156" height="316" rx="20" fill="none" stroke="#2b3d63"/>
  <g transform="translate(48 44)"><circle cx="4" r="4" fill="#39ffba" class="pulse"/><text x="18" y="5" class="label" fill="#39ffba">OBSERVATORY / ONLINE</text><text x="1095" y="5" text-anchor="end" class="tiny">BJ • ASTROPHYSICS + INSTRUMENTATION</text></g>
  <g><text x="48" y="103" class="label">EXOPLANET CHANNEL</text><ellipse cx="282" cy="179" rx="116" ry="56" fill="none" stroke="#43577f" stroke-width="1.5" transform="rotate(-14 282 179)"/><ellipse cx="282" cy="179" rx="142" ry="72" fill="none" stroke="#223354" stroke-dasharray="3 8" transform="rotate(-14 282 179)"/><circle cx="282" cy="179" r="45" fill="url(#starCore)" filter="url(#glow)"/><circle cx="282" cy="179" r="17" fill="#ffcb66"/><g class="planet"><circle cx="392" cy="179" r="9" fill="#7fe7ff" filter="url(#glow)"/><circle cx="392" cy="179" r="15" fill="none" stroke="#7fe7ff" opacity=".25"/></g><path d="M98 275H392" stroke="#263b60"/><text x="98" y="299" class="value">ΔRV  <tspan fill="#39ffba">±0.10 m/s</tspan></text><text x="98" y="319" class="tiny">PRECISION TARGET / CLOSED LOOP</text></g>
  <g><text x="466" y="103" class="label">SPECTRAL ACQUISITION</text><rect x="466" y="126" width="344" height="84" rx="10" fill="#091126" stroke="#263b60"/><rect x="480" y="144" width="316" height="20" rx="5" fill="url(#spectrum)" opacity=".9"/><g fill="#071021"><rect x="514" y="139" width="4" height="30"/><rect x="555" y="139" width="7" height="30"/><rect x="621" y="139" width="3" height="30"/><rect x="666" y="139" width="8" height="30"/><rect x="735" y="139" width="4" height="30"/><rect x="768" y="139" width="6" height="30"/></g><rect x="480" y="129" width="2" height="76" fill="#fff" filter="url(#glow)" class="scan"/><path d="M480 192 C510 185 525 198 550 187 S590 180 615 191 S655 199 680 185 S720 178 744 190 S770 198 796 184" fill="none" stroke="#66d9ff" stroke-width="2"/><path class="dash" d="M466 235H810" stroke="#7c5cff" stroke-width="2"/><text x="466" y="266" class="value">λ / CALIBRATED</text><text x="466" y="290" class="tiny">SNR  148.2</text><text x="598" y="290" class="tiny">DRIFT  0.004 px</text><text x="466" y="319" class="tiny" fill="#39ffba">● FEEDBACK LOCKED</text></g>
  <g><text x="878" y="103" class="label">MISSION TELEMETRY</text><text x="878" y="143" class="tiny">01  INTERFEROMETRIC SENSING</text><text x="1138" y="143" text-anchor="end" class="tiny" fill="#39ffba">ACTIVE</text><path d="M878 156H1138" stroke="#263b60"/><text x="878" y="184" class="tiny">02  ENVIRONMENT MONITOR</text><text x="1138" y="184" text-anchor="end" class="tiny" fill="#39ffba">NOMINAL</text><path d="M878 197H1138" stroke="#263b60"/><text x="878" y="225" class="tiny">03  ACTIVE OPTICS</text><text x="1138" y="225" text-anchor="end" class="tiny" fill="#39ffba">LOCKED</text><path d="M878 238H1138" stroke="#263b60"/><text x="878" y="266" class="tiny">04  SPECTROGRAPH STABILITY</text><text x="1138" y="266" text-anchor="end" class="tiny" fill="#39ffba">99.98%</text><rect x="878" y="292" width="260" height="8" rx="4" fill="#182846"/><rect x="878" y="292" width="238" height="8" rx="4" fill="url(#spectrum)"/><circle cx="1116" cy="296" r="6" fill="#fff" filter="url(#glow)" class="pulse"/><text x="878" y="319" class="tiny">SEARCHING FOR OTHER WORLDS</text></g>
</svg>
