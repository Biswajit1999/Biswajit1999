<g><text x="297" y="386" text-anchor="end" class="label">Portfolio coverage</text><rect x="315" y="364" width="760" height="15" rx="7" class="track"/><rect x="315" y="364" width="418.0" height="15" rx="7" class="before"/><text x="742" y="376" class="value before-text">55</text><rect x="315" y="387" width="760" height="15" rx="7" class="track"/><rect x="315" y="387" width="714.4" height="15" rx="7" class="after"/><text x="1038.4" y="399" class="value after-text">94</text></g>
