<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="766" viewBox="0 0 1200 766" role="img" aria-labelledby="title desc">
  <title id="title">Profile evidence maturity before and after the v1.1 upgrade</title>
  <desc id="desc">Eight paired horizontal bars compare before and after scores. The composite rises from 36 to 95 out of 100. Scores measure auditable research communication, not scientific merit.</desc>
  <style>.bg{fill:#07111f}.title{font:700 34px system-ui,sans-serif;fill:#f8fafc}.subtitle{font:18px system-ui,sans-serif;fill:#a9b8ce}.label{font:600 17px system-ui,sans-serif;fill:#e2e8f0}.value{font:700 14px ui-monospace,monospace}.track{fill:#1b2c42}.before{fill:#64748b}.after{fill:#2dd4bf}.before-text{fill:#cbd5e1}.after-text{fill:#5eead4}.legend{font:600 15px system-ui,sans-serif;fill:#cbd5e1}.note{font:15px system-ui,sans-serif;fill:#94a3b8}</style>
  <rect class="bg" width="1200" height="766" rx="24"/><text x="60" y="62" class="title">Profile evidence maturity · 36 → 95</text><text x="60" y="96" class="subtitle">Versioned releases, generated findings and inference boundaries replace untraceable profile claims.</text><rect x="60" y="126" width="22" height="12" rx="6" class="before"/><text x="92" y="138" class="legend">Before</text><rect x="176" y="126" width="22" height="12" rx="6" class="after"/><text x="208" y="138" class="legend">After</text><text x="1075" y="138" text-anchor="end" class="note">0–100 documented rubric</text><g><text x="297" y="212" text-anchor="end" class="label">Claim provenance</text><rect x="315" y="190" width="760" height="15" rx="7" class="track"/><rect x="315" y="190" width="266.0" height="15" rx="7" class="before"/><text x="590" y="202" class="value before-text">35</text><rect x="315" y="213" width="760" height="15" rx="7" class="track"/><rect x="315" y="213" width="729.6" height="15" rx="7" class="after"/><text x="1053.6" y="225" class="value after-text">96</text></g>
<g><text x="297" y="270" text-anchor="end" class="label">Release traceability</text><rect x="315" y="248" width="760" height="15" rx="7" class="track"/><rect x="315" y="248" width="76.0" height="15" rx="7" class="before"/><text x="400" y="260" class="value before-text">10</text><rect x="315" y="271" width="760" height="15" rx="7" class="track"/><rect x="315" y="271" width="744.8" height="15" rx="7" class="after"/><text x="1068.8" y="283" class="value after-text">98</text></g>
