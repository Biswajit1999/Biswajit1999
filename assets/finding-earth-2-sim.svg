<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Finding Earth 2.0 visual research snapshot</title>
<desc id="desc">Animated catalogue funnel and habitable-zone screening visualization for the Finding Earth 2.0 project.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1d2e"/></linearGradient>
  <linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#22c55e" stop-opacity=".08"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<rect x="26" y="26" width="1148" height="568" rx="22" fill="none" stroke="#2a3f56"/>
<text x="56" y="74" fill="#f8fafc" font-size="34" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Finding Earth 2.0 in Distant Worlds</text>
<text x="56" y="108" fill="#9fb3c8" font-size="18" font-family="Inter,Segoe UI,sans-serif">Catalogue screening • evidence provenance • uncertainty-aware analysis</text>

<g font-family="Inter,Segoe UI,sans-serif">
  <text x="62" y="178" fill="#67e8f9" font-size="32" font-weight="700">164,209</text><text x="62" y="204" fill="#b8c7d9" font-size="15">source records</text>
  <path d="M184 188 H258" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/></path>
  <text x="282" y="178" fill="#67e8f9" font-size="32" font-weight="700">6,354</text><text x="282" y="204" fill="#b8c7d9" font-size="15">confirmed planets</text>
  <path d="M412 188 H486" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/></path>
  <text x="510" y="178" fill="#86efac" font-size="32" font-weight="700">174</text><text x="510" y="204" fill="#b8c7d9" font-size="15">conservative HZ</text>
  <path d="M622 188 H696" stroke="#22c55e" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/></path>
  <text x="720" y="178" fill="#fbbf24" font-size="32" font-weight="700">15</text><text x="720" y="204" fill="#b8c7d9" font-size="15">small + temperate screen</text>
</g>

<g transform="translate(58 250)">
  <rect width="742" height="292" rx="18" fill="#091726" stroke="#23384d"/>
  <text x="24" y="34" fill="#dbeafe" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="600">Illustrative habitable-zone screening view</text>
  <line x1="72" y1="240" x2="700" y2="240" stroke="#4b6178"/><line x1="72" y1="58" x2="72" y2="240" stroke="#4b6178"/>
  <rect x="295" y="58" width="178" height="182" fill="url(#hz)"/>
  <text x="334" y="82" fill="#86efac" font-size="13" font-family="Inter,Segoe UI,sans-serif">conservative HZ</text>
  <g fill="#8aa4be" opacity=".58">
    <circle cx="112" cy="197" r="4"/><circle cx="145" cy="160" r="3"/><circle cx="178" cy="205" r="4"/><circle cx="207" cy="132" r="4"/><circle cx="238" cy="173" r="3"/><circle cx="266" cy="113" r="4"/><circle cx="318" cy="193" r="3"/><circle cx="340" cy="154" r="4"/><circle cx="386" cy="126" r="3"/><circle cx="430" cy="174" r="4"/><circle cx="468" cy="101" r="3"/><circle cx="502" cy="146" r="4"/><circle cx="548" cy="190" r="3"/><circle cx="585" cy="126" r="4"/><circle cx="626" cy="160" r="3"/><circle cx="664" cy="99" r="4"/>
  </g>
  <g fill="#34d399" filter="url(#glow)">
    <circle cx="327" cy="168" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="361" cy="142" r="5"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="401" cy="189" r="6"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="443" cy="118" r="5"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="306" y="274" fill="#7f95aa" font-size="12" font-family="Inter,Segoe UI,sans-serif">Screening visual only — not a probability-of-life estimate.</text>
</g>

<g transform="translate(838 246)">
  <circle cx="150" cy="142" r="106" fill="#0d2844" stroke="#345a7a" stroke-width="2"/>
  <circle cx="150" cy="142" r="82" fill="#12385a"/>
  <path d="M82 112 C110 82 132 83 156 98 C181 114 196 94 220 116 C206 141 190 159 159 164 C128 170 101 150 82 112Z" fill="#4a9e78" opacity=".82"/>
  <ellipse cx="150" cy="142" rx="124" ry="39" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="9 8" opacity=".72"><animateTransform attributeName="transform" type="rotate" from="0 150 142" to="360 150 142" dur="10s" repeatCount="indefinite"/></ellipse>
  <circle r="7" fill="#fbbf24" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" path="M274 142 A124 39 0 1 1 26 142 A124 39 0 1 1 274 142"/></circle>
  <text x="55" y="290" fill="#f8fafc" font-size="19" font-family="Inter,Segoe UI,sans-serif" font-weight="600">Known worlds → measured evidence</text>
  <text x="72" y="316" fill="#92a9bf" font-size="14" font-family="Inter,Segoe UI,sans-serif">Reproducible archive-driven search</text>
</g>
</svg>