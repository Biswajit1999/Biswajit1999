name: Render DEEP SKY research cover

on:
  push:
    branches: [main]
    paths:
      - "scripts/profile_cinema.py"
      - "scripts/deep_sky_telemetry.py.gz.b64"
      - ".github/workflows/profile-cinema.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-profile-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out research profile
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install deterministic scientific rendering packages
        run: |
          python -m pip install pillow numpy opencv-python-headless

      - name: Materialize documented DEEP SKY telemetry source
        run: |
          base64 --decode scripts/deep_sky_telemetry.py.gz.b64 | gzip --decompress > scripts/deep_sky_telemetry.py
          python -m py_compile scripts/deep_sky_telemetry.py scripts/profile_cinema.py

      - name: Render existing cinematic Earth radar and 3 scientific simulations
        env:
          PROFILE_OUT: assets/profile-cinema
        run: |
          python -u scripts/profile_cinema.py --hero-only
          python -u scripts/deep_sky_telemetry.py

      - name: Check realistic scene, visual plots, accessibility and size
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/profile-cinema')
          gif=root/'research-radar-cinematic.gif'
          fig=root/'deep-sky-telemetry.gif'
          photo=root/'hero-preview.jpg'
          still=root/'deep-sky-telemetry.jpg'
          for file in (gif,fig,photo,still):
              assert file.is_file() and file.stat().st_size > 10_000, file
          for file,size,minimum in ((gif,(1320,438),40),(fig,(1320,350),30)):
              with Image.open(file) as im:
                  assert im.size == size, (file,im.size)
                  assert im.n_frames >= minimum, (file,im.n_frames)
                  assert im.info.get('loop') == 0
                  print(file,im.n_frames,im.size,file.stat().st_size)
          assert gif.stat().st_size + fig.stat().st_size < 10_000_000, 'Animation combined budget exceeded'
          for name in ('exohspec','finding-earth','precision-rv','nasadiya'):
              assert (root/('v4-'+name+'.jpg')).is_file()
          from scripts.deep_sky_telemetry import DEPTH
          assert abs(DEPTH-.0081)<1e-10
          PY
          git diff --check

      - name: Publish reproducible source and rendered cover under author
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add scripts/deep_sky_telemetry.py assets/profile-cinema/research-radar-cinematic.gif assets/profile-cinema/hero-preview.jpg assets/profile-cinema/deep-sky-telemetry.gif assets/profile-cinema/deep-sky-telemetry.jpg
          if git diff --cached --quiet; then
            echo "DEEP SKY already matches committed assets."
          else
            git commit -m "design: publish DEEP SKY cinematic telescope and model-driven astronomy simulation"
            git push
          fi
