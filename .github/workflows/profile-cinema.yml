name: Render observatory radar cover

on:
  push:
    branches: [main]
    paths:
      - "scripts/profile_cinema.py"
      - ".github/workflows/profile-cinema.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-profile-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out research profile
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install offline image renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless

      - name: Update existing animated radar, not project artwork
        env:
          PROFILE_OUT: assets/profile-cinema
        run: python -u scripts/profile_cinema.py --hero-only

      - name: Check animated cover and existing project artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("assets/profile-cinema")
          gif = root / "research-radar-cinematic.gif"
          assert gif.is_file() and 100_000 < gif.stat().st_size < 13_000_000
          with Image.open(gif) as image:
              assert image.size == (1320, 438), image.size
              assert image.n_frames >= 40, image.n_frames
              assert image.info.get("loop", -1) == 0
              print("Radar:", image.n_frames, "frames", gif.stat().st_size, "bytes")
          for name in ("exohspec", "finding-earth", "precision-rv", "nasadiya"):
              card = root / ("v4-" + name + ".jpg")
              assert card.is_file(), card
          PY
          git diff --check

      - name: Commit refreshed GIF under profile author
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add assets/profile-cinema/research-radar-cinematic.gif assets/profile-cinema/hero-preview.jpg
          if git diff --cached --quiet; then
            echo "Radar already up to date."
          else
            git commit -m "design: refresh animated telescope-to-stars signal search"
            git push
          fi
