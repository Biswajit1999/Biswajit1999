name: Render cinematic GitHub profile

on:
  push:
    branches: [main]
    paths:
      - "scripts/profile_cinema.py.gz.b64"
      - ".github/workflows/profile-cinema.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-profile-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image-rendering requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless

      - name: Materialize the readable renderer
        run: |
          base64 --decode scripts/profile_cinema.py.gz.b64 | gzip --decompress > scripts/profile_cinema.py
          python -m py_compile scripts/profile_cinema.py

      - name: Render cinematic radar and research cards
        env:
          PROFILE_OUT: assets/profile-cinema
        run: python -u scripts/profile_cinema.py

      - name: Validate visual assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("assets/profile-cinema")
          gif=root/"research-radar-cinematic.gif"
          assert gif.exists() and gif.stat().st_size > 100_000
          with Image.open(gif) as im:
              assert im.n_frames >= 20, im.n_frames
              assert im.size == (1320,438), im.size
              print("Animated cover:", im.n_frames, "frames", im.size, gif.stat().st_size, "bytes")
          for name in ("exohspec","finding-earth","precision-rv","nasadiya"):
              img=root/(name+"-research.jpg")
              with Image.open(img) as im:
                  assert im.size == (720,355), (name,im.size)
              print("Project card:", img, img.stat().st_size, "bytes")
          PY
          git diff --check

      - name: Publish reusable renderer and generated images
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add scripts/profile_cinema.py assets/profile-cinema/
          if git diff --cached --quiet; then
            echo "Images already match; nothing to commit."
          else
            git commit -m "design: publish cinematic radar motion and cohesive research art"
            git push
          fi
